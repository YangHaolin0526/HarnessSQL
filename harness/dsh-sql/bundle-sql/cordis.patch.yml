# dsh-bundle-sql — the SQL-task layer, applied over dsh-base + dsh-headless.
#
# Two jobs. First it PRUNES: every capability a text-to-SQL agent has no
# business holding (shell, filesystem, web, subagents, workflows, skills,
# goals, todos, plan mode, telemetry) is disabled, so `sql_*` is the agent's
# entire tool surface and the benchmark measures SQL reasoning rather than
# tool-choice noise. Second it MOUNTS: one OpenAI-compatible LLM route pair
# (local vLLM, hosted gateway) and the SQL toolset itself.
#
# Row order is irrelevant to loading; the grouping is for readers.

# ---------------------------------------------------------------- model seam

# The shipped DeepSeek adapter wants DEEPSEEK_API_KEY and adds a second route
# family we never select. The pi-ai adapter below serves both our providers.
- id: llm-deepseek
  disabled: true

# Both routes are hand-declared: pi-ai ships no catalog for a local vLLM server
# or for this gateway, so the profile supplies endpoint, protocol, and models.
# Keys stay references — resolved per request from the environment, never
# inlined here.
- id: llm-pi-ai
  config:
    providers:
      vllm:
        displayName: Local vLLM
        apiKeyEnv: VLLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DSH_SQL_VLLM_BASE_URL ?? 'http://127.0.0.1:8000/v1'
        # An OpenAI-compatible server that is not OpenAI: keep the system
        # prompt on `system`, cap output with `max_tokens`.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        defaultContextWindow: 131072
        defaultMaxTokens: !!js Number(process.env.DSH_SQL_MAX_TOKENS ?? 8192)
        models:
          - id: !!js process.env.DSH_SQL_VLLM_MODEL ?? 'Qwen3.5-9B'
            contextWindow: !!js Number(process.env.DSH_SQL_VLLM_CONTEXT ?? 131072)
            maxTokens: !!js Number(process.env.DSH_SQL_MAX_TOKENS ?? 8192)
      gateway:
        displayName: Hosted gateway
        apiKeyEnv: DSH_SQL_GATEWAY_KEY
        api: openai-completions
        baseURL: !!js process.env.DSH_SQL_GATEWAY_BASE_URL ?? 'https://example.invalid/v1'
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.DSH_SQL_GATEWAY_MODEL ?? 'hosted-model'
            contextWindow: !!js Number(process.env.DSH_SQL_GATEWAY_CONTEXT ?? 131072)
            maxTokens: !!js Number(process.env.DSH_SQL_MAX_TOKENS ?? 8192)

- id: agent-default-model
  config:
    provider: !!js process.env.DSH_SQL_PROVIDER ?? 'vllm'
    model: !!js process.env.DSH_SQL_MODEL ?? 'Qwen3.5-9B'

# One task per process, so a per-session title would spend a model call to name
# a session nobody reads.
- id: session-title-llm
  disabled: true

