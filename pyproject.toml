[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-sql"
version = "0.1.0"
description = "Harness-aware SQL data generation, dsh-sql trajectories, SFT, and RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "PyYAML>=6.0",
  "zstandard>=0.22",
]

[project.optional-dependencies]
sft = ["datasets>=2.19", "torch>=2.3", "transformers>=4.51"]
rl = ["aiohttp>=3.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["data_synthesis", "dbt_sqlite", "text2sql"]
package-dir = {data_synthesis = "data_generation/data_synthesis", dbt_sqlite = "data_generation/dbt_sqlite", text2sql = "training/rl/text2sql"}

[tool.setuptools.package-data]
data_synthesis = ["blueprint.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
